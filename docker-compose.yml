services:
  app:
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    image: docker.io/thecodingmachine/php:8.5-v5-apache
    expose:
      - 80
    volumes:
      - ./:/var/www/html
      - ./storage/code-coverage:/opt/phpstorm-coverage
    depends_on:
      db:
        condition: service_healthy
      mailhog:
        condition: service_started
    environment:
      APACHE_DOCUMENT_ROOT: public/

      PHP_EXTENSIONS: "intl gmp sqlite3 pdo_sqlite bcmath xdebug"

      #      PHP_INI_MEMORY_LIMIT: 100M

      STARTUP_COMMAND_1: composer setup

      CRON_SCHEDULE: "* * * * *"
      CRON_COMMAND: php artisan schedule:run

  db:
    image: docker.io/mariadb:11.8
    environment:
      MARIADB_ROOT_PASSWORD: futtertrog
      MARIADB_DATABASE: futtertrog
      MARIADB_USER: futtertrog
      MARIADB_PASSWORD: futtertrog
    volumes:
      - db:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

  mailhog:
    image: docker.io/mailhog/mailhog:latest
    expose:
      - 1025 # smtp
      - 8025 # webUI

volumes:
  db:
